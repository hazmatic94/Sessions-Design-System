  <body>
    <div class="showroom-shell">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="sidebar-scroll">
          <div class="sidebar-header">
            <a
              class="brand-logo"
              href="#/home"
              aria-label="Joker Design System home">
              <span class="brand-logo-mark" aria-hidden="true">
                <video
                  class="brand-logo-video"
                  src="./assets/JokerGoldLogoV2-loop.mp4?v=joker-gold-logo-loop-v1"
                  autoplay
                  muted
                  playsinline
                  preload="auto"></video>
              </span>
              <span class="brand-logo-version">v1.0</span>
            </a>

            <div class="theme-toggle" role="group" aria-label="Theme">
              <button
                class="theme-toggle-button is-disabled"
                type="button"
                data-theme-mode="light"
                aria-label="Light mode"
                aria-pressed="false"
                aria-disabled="true"
                tabindex="-1">
                <span data-lucide="sun" aria-hidden="true"></span>
              </button>
              <button
                class="theme-toggle-button is-active"
                type="button"
                data-theme-mode="dark"
                aria-label="Dark mode"
                aria-pressed="true">
                <span data-lucide="moon" aria-hidden="true"></span>
              </button>
              <span class="theme-toggle-divider" aria-hidden="true"></span>
              <button
                id="sidebar-close"
                class="sidebar-close-button"
                type="button"
                aria-label="Close navigation">
                <span data-lucide="x" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <nav id="primary-nav" class="nav-groups"></nav>
        </div>

        <div
          class="custom-scrollbar custom-scrollbar--sidebar"
          aria-hidden="true">
          <span class="custom-scrollbar-line is-outer-left"></span>
          <div class="custom-scrollbar-thumb"></div>
          <span class="custom-scrollbar-line is-outer-right"></span>
        </div>
      </aside>

      <div class="workspace">
        <header class="mobile-header mobile-only">
          <a
            class="brand-logo"
            href="#/home"
            aria-label="Joker Design System home">
            <span class="brand-logo-mark" aria-hidden="true">
              <video
                class="brand-logo-video"
                src="./assets/JokerGoldLogoV2-loop.mp4?v=joker-gold-logo-loop-v1"
                autoplay
                muted
                playsinline
                preload="auto"></video>
            </span>
          </a>
          <button
            id="sidebar-toggle"
            class="icon-button"
            type="button"
            aria-label="Toggle navigation">
            <span data-lucide="menu" aria-hidden="true"></span>
          </button>
        </header>

        <main id="content" class="content" tabindex="-1"></main>

        <div id="scroll-cue" class="scroll-cue" aria-hidden="false">
          <button
            class="scroll-cue-button"
            type="button"
            aria-label="Scroll down one screen">
            <span data-lucide="chevron-down" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>

    <div
      class="custom-scrollbar custom-scrollbar--workspace"
      aria-hidden="true">
      <span class="custom-scrollbar-line is-outer-left"></span>
      <div class="custom-scrollbar-thumb"></div>
      <span class="custom-scrollbar-line is-outer-right"></span>
    </div>
    </div>

    <script src="./app.js?v=home-logo-v5-loop" type="module"></script>
  </body>
